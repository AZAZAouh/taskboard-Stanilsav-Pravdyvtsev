<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TaskBoard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
   >
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
    <main class="container login-wrap">
      <h1 class="text-center">TaskBoard</h1>
      <p class="text-center text-muted">Zadania zespołu w jednym miejscu</p>
      <div class="card p-4 shadow-sm">
        <ul class="nav nav-tabs mb-4" role="tablist">
          <li class="nav-item" role="presentation">
            <button
              id="loginTab"
              role="tab"
              aria-controls="loginPanel"
              aria-selected="true"
              class="nav-link active"
              data-bs-toggle="tab"
              data-bs-target="#loginPanel"
              type="button"
            >
              Logowanie
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              id="registerTab"
              role="tab"
              aria-controls="registerPanel"
              aria-selected="false"
              class="nav-link"
              data-bs-toggle="tab"
              data-bs-target="#registerPanel"
              type="button"
            >
              Rejestracja
            </button>
          </li>
        </ul>
        <div id="message" role="alert"></div>
        <div class="tab-content">
          <div
            class="tab-pane fade show active"
            id="loginPanel"
            role="tabpanel"
            aria-labelledby="loginTab"
          >
            <form id="loginForm">
              <label for="login" class="form-label">Login</label
              ><input
                id="login"
                autocomplete="username"
                class="form-control mb-3"
                required
             ><label for="password" class="form-label">Hasło</label
              ><input
                id="password"
                autocomplete="current-password"
                type="password"
                class="form-control mb-3"
                required
             ><button class="btn btn-primary w-100">Zaloguj się</button>
            </form>
          </div>
          <div
            class="tab-pane fade"
            id="registerPanel"
            role="tabpanel"
            aria-labelledby="registerTab"
          >
            <form id="registerForm">
              <label for="regLogin" class="form-label">Login</label
              ><input
                id="regLogin"
                autocomplete="username"
                class="form-control mb-3"
                minlength="3"
                maxlength="30"
                required
             ><label for="firstName" class="form-label">Imię</label
              ><input
                id="firstName"
                autocomplete="given-name"
                class="form-control mb-3"
                required
             ><label for="lastName" class="form-label">Nazwisko</label
              ><input
                id="lastName"
                autocomplete="family-name"
                class="form-control mb-3"
                required
             ><label for="regPassword" class="form-label"
                >Hasło (min. 8 znaków)</label
              ><input
                id="regPassword"
                autocomplete="new-password"
                type="password"
                class="form-control mb-3"
                minlength="8"
                required
             ><label for="confirmPassword" class="form-label"
                >Powtórz hasło</label
              ><input
                id="confirmPassword"
                autocomplete="new-password"
                type="password"
                class="form-control mb-3"
                required
             ><button class="btn btn-primary w-100">Utwórz konto</button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
