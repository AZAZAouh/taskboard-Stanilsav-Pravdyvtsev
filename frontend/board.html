<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablica – TaskBoard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">TaskBoard</span>
      <div class="d-flex align-items-center gap-3">
        <span class="text-light small" id="userInfo"></span>
        <button class="btn btn-outline-light btn-sm" id="logoutBtn">Wyloguj</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <label for="priorityFilter" class="form-label">Priorytet</label>
        <select class="form-select" id="priorityFilter">
          <option value="">Wszystkie</option>
          <option value="niski">Niski</option>
          <option value="sredni">Średni</option>
          <option value="pilny">Pilny</option>
        </select>
      </div>
      <button class="btn btn-success" id="addTaskBtn">Dodaj zadanie</button>
    </div>

    <div class="row g-3">
      <section class="col-12 col-lg-4">
        <h2 class="h5">Do zrobienia</h2>
        <div class="d-grid gap-2" id="col-todo"></div>
      </section>
      <section class="col-12 col-lg-4">
        <h2 class="h5">W trakcie</h2>
        <div class="d-grid gap-2" id="col-in_progress"></div>
      </section>
      <section class="col-12 col-lg-4">
        <h2 class="h5">Gotowe</h2>
        <div class="d-grid gap-2" id="col-done"></div>
      </section>
    </div>
  </main>

  <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="taskForm">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Zadanie</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="taskId">
            <div class="mb-3">
              <label for="taskTitle" class="form-label">Tytuł</label>
              <input type="text" class="form-control" id="taskTitle" required>
            </div>
            <div class="mb-3">
              <label for="taskDescription" class="form-label">Opis</label>
              <textarea class="form-control" id="taskDescription" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label for="taskStatus" class="form-label">Status</label>
              <select class="form-select" id="taskStatus">
                <option value="todo">Do zrobienia</option>
                <option value="in_progress">W trakcie</option>
                <option value="done">Gotowe</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="taskPriority" class="form-label">Priorytet</label>
              <select class="form-select" id="taskPriority">
                <option value="niski">Niski</option>
                <option value="sredni" selected>Średni</option>
                <option value="pilny">Pilny</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anuluj</button>
            <button type="submit" class="btn btn-primary">Zapisz</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/board.js"></script>
</body>
</html>
