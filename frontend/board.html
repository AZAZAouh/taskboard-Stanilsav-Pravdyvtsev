<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TaskBoard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
   >
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="boards.html">TaskBoard</a>
        <div class="d-flex align-items-center gap-3">
          <span class="text-white" id="userName"></span
          ><button class="btn btn-outline-light btn-sm" id="logoutBtn">
            Wyloguj
          </button>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      <a class="back-link" href="boards.html"
        ><span aria-hidden="true">‹</span> Tablice</a
      >
      <div class="d-flex align-items-center justify-content-between gap-3">
        <h1 id="boardName">Tablica</h1>
        <button id="openTrash" class="btn btn-outline-secondary btn-sm">
          Kosz
        </button>
      </div>
      <p id="boardDescription" class="text-muted"></p>
      <div id="message" role="alert"></div>
      <div class="row g-3 align-items-end mb-4">
        <div class="col-md-3">
          <label for="filterPriority" class="form-label">Priorytet</label
          ><select id="filterPriority" class="form-select">
            <option value="">Wszystkie</option>
            <option value="low">Niski</option>
            <option value="medium">Średni</option>
            <option value="high">Wysoki</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="filterPerson" class="form-label">Osoba</label
          ><select id="filterPerson" class="form-select">
            <option value="">Wszyscy</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="filterTitle" class="form-label">Szukaj w tytułach</label
          ><input id="filterTitle" class="form-control" type="search">
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button id="clearFilters" class="btn btn-outline-secondary">
            Wyczyść filtry</button
          ><button id="newTask" class="btn btn-primary">Dodaj zadanie</button>
        </div>
      </div>
      <div class="row g-3">
        <section class="col-lg-4">
          <div class="task-column todo">
            <h2>Do zrobienia</h2>
            <div id="col-todo"></div>
          </div>
        </section>
        <section class="col-lg-4">
          <div class="task-column progress-col">
            <h2>W trakcie</h2>
            <div id="col-in_progress"></div>
          </div>
        </section>
        <section class="col-lg-4">
          <div class="task-column done">
            <h2>Gotowe</h2>
            <div id="col-done"></div>
          </div>
        </section>
      </div>
    </main>
    <div
      class="modal fade"
      id="taskModal"
      tabindex="-1"
      aria-labelledby="taskModalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="taskForm">
            <div class="modal-header">
              <h2 class="modal-title fs-5" id="taskModalTitle">Zadanie</h2>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Zamknij"
              ></button>
            </div>
            <div class="modal-body">
              <div id="taskError" role="alert"></div>
              <label for="taskTitle" class="form-label">Tytuł</label
              ><input
                id="taskTitle"
                class="form-control mb-3"
                minlength="3"
                maxlength="100"
                required
             ><label for="taskDescription" class="form-label"
                >Opis (opcjonalnie)</label
              ><textarea
                id="taskDescription"
                class="form-control mb-3"
              ></textarea>
              <div class="row">
                <div class="col-sm-6">
                  <label for="taskStatus" class="form-label">Status</label
                  ><select id="taskStatus" class="form-select mb-3">
                    <option value="todo">Do zrobienia</option>
                    <option value="in_progress">W trakcie</option>
                    <option value="done">Gotowe</option>
                  </select>
                </div>
                <div class="col-sm-6">
                  <label for="taskPriority" class="form-label">Priorytet</label
                  ><select id="taskPriority" class="form-select mb-3">
                    <option value="low">Niski</option>
                    <option value="medium" selected>Średni</option>
                    <option value="high">Wysoki</option>
                  </select>
                </div>
                <div class="col-sm-6">
                  <label for="taskDeadline" class="form-label"
                    >Termin (opcjonalnie)</label
                  ><input
                    id="taskDeadline"
                    type="date"
                    class="form-control mb-3"
                 >
                </div>
                <div class="col-sm-6">
                  <label for="taskAssignee" class="form-label"
                    >Osoba (opcjonalnie)</label
                  ><select id="taskAssignee" class="form-select mb-3">
                    <option value="">Nieprzypisane</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Anuluj</button
              ><button class="btn btn-primary">Zapisz zadanie</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div
      class="modal fade"
      id="trashModal"
      tabindex="-1"
      aria-labelledby="trashTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="trashTitle">Kosz zadań</h2>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Zamknij"
            ></button>
          </div>
          <div class="modal-body">
            <p class="text-muted small">
              Przywrócone zadanie wróci do swojej poprzedniej kolumny.
            </p>
            <div id="trashError" role="alert"></div>
            <div id="trashList" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/board.js"></script>
  </body>
</html>
