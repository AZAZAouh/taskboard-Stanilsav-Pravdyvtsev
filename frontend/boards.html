<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TaskBoard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
   >
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="boards.html">TaskBoard</a>
        <div class="d-flex align-items-center gap-3">
          <span class="text-white" id="userName"></span
          ><button class="btn btn-outline-light btn-sm" id="logoutBtn">
            Wyloguj
          </button>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Tablice</h1>
        <button class="btn btn-primary" id="newBoard">Nowa tablica</button>
      </div>
      <div id="message" role="alert"></div>
      <div class="row g-3" id="boards"></div>
    </main>
    <div
      class="modal fade"
      id="boardModal"
      tabindex="-1"
      aria-labelledby="boardModalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="boardForm">
            <div class="modal-header">
              <h2 class="modal-title fs-5" id="boardModalTitle">Tablica</h2>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Zamknij"
              ></button>
            </div>
            <div class="modal-body">
              <div id="boardError" role="alert"></div>
              <label class="form-label" for="boardName">Nazwa</label
              ><input
                id="boardName"
                class="form-control mb-3"
                maxlength="80"
                required
             ><label class="form-label" for="boardDescription"
                >Opis (opcjonalnie)</label
              ><textarea
                id="boardDescription"
                class="form-control"
                maxlength="255"
              ></textarea>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Anuluj</button
              ><button class="btn btn-primary">Zapisz tablicę</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/boards.js"></script>
  </body>
</html>
